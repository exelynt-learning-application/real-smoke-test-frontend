
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
  </head>

  <body>
    <form id="login-form" novalidate aria-label="Sign in">
      <h1>Sign in</h1>

      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
      />
      <p id="email-error" role="alert" hidden></p>

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
      />
      <p id="password-error" role="alert" hidden></p>

      <button type="submit">Sign in</button>
    </form>

    <script type="module">
      import { initLogin } from './src/login.js';

      initLogin(
        document,
        sessionStorage,
        (url) => window.location.assign(url)
      );
    </script>
  </body>
</html>
